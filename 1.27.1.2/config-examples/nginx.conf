#user  nobody;
worker_processes 5;

error_log  logs/error.log;
error_log  logs/error.log  notice;
error_log  logs/error.log  info;
error_log  logs/debug.log  debug;
#debug_log logs/debug.log

#pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {

    include       mime.types;
    default_type  "text/html";

    # Обязательно - через эту память передаём настройки для конфига (параметры коннекта к Redis)

    lua_shared_dict settings 10m;         #Настройки системы (кэширование Green/Blue)
    lua_shared_dict anomaly_counters 10m; #Счетчик аномалий SSL
    gatekeeper_stats_shm gatekeeper 1m;   # Зона общей памяти

    # Отключаем логирование ошибок сокетов, чтобы не засорять логи
    lua_socket_log_errors off;

    #Кэшировать скрипты LUA.
    lua_code_cache on;
    #Размер буфера для php-fpm
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
#Лимиты на ожидание данных от клиента (Защита от Slowloris-атак)
    client_body_timeout 3s;
    client_header_timeout 3s;
    send_timeout 5s;

    client_header_buffer_size    1k;
    large_client_header_buffers  4 4k;

    client_body_buffer_size      10M;
    client_max_body_size         20M;


    sendfile        on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

#--------------------------------------------------
    # Инициализация, выполняемая один раз при старте Nginx
    init_by_lua_block {

    }
#--------------------------------------------------
    # Скрипт очистки индексов удалённых записей
    init_worker_by_lua_block {

    }
#--------------------------------------------------
    # Блок для логирования
    log_by_lua_block {

    }
#--------------------------------------------------
    access_by_lua_block {

    }
#--------------------------------------------------
#==================================================
#--------------------------------------------------
    server {
        listen      80;
        server_name default_server;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name superpc.ru;
        http2 on;
        root /usr/local/openresty/nginx/html;
        index index.php index.html;

        ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;
        ssl_dhparam /etc/ssl/nginx_dhparam.pem;

    # Указываем DNS (Google или Cloudflare)
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        resolver_timeout 5s;
#--------------------------------------------------
        ssl_client_hello_by_lua_block {

        }
#--------------------------------------------------
    # Блок для финта ушами с проксированием для gzip и окончательной обработкой ответов
       header_filter_by_lua_block {

       }
#--------------------------------------------------
    # Блок для модификации тела ответа
        body_filter_by_lua_block { -- Проверка флага и внедрение JavaScript

        }
#--------------------------------------------------
        location = /favicon.ico {
            log_not_found off;
            access_log off;
            return 204;
        }
        location /.well-known/appspecific/ {
            log_not_found off;
            access_log off;
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.php?$args;
        }
#-----------------------------------------------------------
# Кэширование статики - оптимизация под высокую нагрузку
        location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
            expires 365d;
            access_log off;
        }
# ------------------------
        set $gk_api_data ""; #Важно для АПИ!
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php7.4-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param GK_API_DATA $gk_api_data; #Важно для АПИ!
        }

        location /check {
            default_type text/plain;
            content_by_lua_block {
                ngx.header["Content-Type"] = "text/html; charset=utf-8"
                local body = {
                    "GK5Z: ", ngx.var.http_gk5z_gk5z or "N/A", "<br>",
                    "Client extensions: ", ngx.var.http_gk5z_client_extn or "N/A", "<br>",
                    "Client ciphers: ", ngx.var.http_gk5z_client_ciph or "N/A", "<br>",
                    "Client supp.versions: ", ngx.var.http_gk5z_tls_supp_ver or "N/A", "<br>",
                    "Client supp.groups: ", ngx.var.http_gk5z_tls_supp_groups or "N/A", "<br>",
                    "Client supp.algorithms: ", ngx.var.http_gk5z_client_algs or "N/A", "<br>",
                    "Client ALPN: ", ngx.var.http_gk5z_client_alpn or "N/A", "<br>",
                    "Client random:", ngx.var.http_gk5z_random or "N/A", "<br>",
                    "PSK modes: ", ngx.var.ngx_gk5z_tls_psk_modes or "N/A", "<br>",
                    "SNI: ", ngx.var.http_gk5z_SNI or "N/A", "<br>",
                    "==============================================<br>",
                }
                ngx.say(table.concat(body))
                return ngx.exit(ngx.OK)
            }
        }
    }
}
